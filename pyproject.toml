[project]
name = "stocks-crew-demo"
version = "0.1.0"
description = "Workshop exercise: a four-agent CrewAI crew (research, technical, sector, report) that reaches a real MCP stdio server for stock analytics, with a live trace of every tool call. Lab 1 of 4; Labs 2-4 live under apps/."
readme = "README.md"
# 3.12 is what the workshop is tested on. crewai 1.10 pulls in a large native
# dependency tree (onnx, chroma, ...) that lags behind new Python releases, so
# 3.13 is deliberately excluded until it is verified.
requires-python = ">=3.11,<3.13"
dependencies = [
    # Lab 1 runtime. Keep in step with requirements.txt (what `make dev-install`
    # installs for Labs 1-3).
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # >=1.66: older Streamlit breaks on Starlette 1.4+ ("Connection error").
    "streamlit>=1.66",
    # Official MCP Python SDK (mcp.server.fastmcp). Capped <2.0: 2.0 removed it.
    "mcp>=1.9,<2.0",
    # Pinned to versions verified working; see the note in requirements.txt.
    "crewai==1.10.1",
    # The [mcp] extra provides crewai_tools.MCPServerAdapter.
    "crewai-tools[mcp]==1.10.1",
    "langchain==1.2.12",
    "langchain-google-genai==4.2.1",
    "langchain-openai>=0.2",
    "langchain-core==1.2.18",
    "langchain-google-vertexai>=1.0",
    "litellm>=1.0.0",
]

[project.scripts]
stocks-crew-mcp = "stocks_crew.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stocks_crew"]

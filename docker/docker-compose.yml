# =============================================================================
# Stock Agent Platform — Docker Compose (Local Development)
# =============================================================================
# Teaching note:
#   This file represents Stage 2 of our 4-stage architecture.
#   All services run locally, with network boundaries between them.
#
#   Start everything: make up
#   URLs:
#     Streamlit UI     : http://localhost:8501
#     Job API docs     : http://localhost:8000/docs
#     MCP Server docs  : http://localhost:8001/docs
#     Agent Runtime    : http://localhost:8002/docs (HTTP mode)
#     Langfuse UI      : http://localhost:3000
#     Redis            : localhost:6379
#     Pub/Sub emulator : localhost:8085
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Shared environment — overridden per service below
# ---------------------------------------------------------------------------
x-common-env: &common-env
  LOG_LEVEL: INFO
  LOG_FORMAT: text           # Human-readable for local dev
  ENVIRONMENT: local

  # GCP Configuration
  GCP_PROJECT: ${GCP_PROJECT:-local-project}
  GCP_REGION: ${GCP_REGION:-us-central1}
  VERTEX_LOCATION: ${VERTEX_LOCATION:-global}

  # LLM — uses Google AI Studio key locally
  LLM_PROVIDER: ${LLM_PROVIDER:-google_ai_studio}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_FAST_MODEL: gemini-3.1-flash-lite
  GEMINI_MAIN_MODEL: gemini-3.5-flash
  GEMINI_STRONG_MODEL: gemini-3.1-pro-preview
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_FAST_MODEL: ${OPENAI_FAST_MODEL:-gpt-4o-mini}
  OPENAI_MAIN_MODEL: ${OPENAI_MAIN_MODEL:-gpt-4o-mini}
  OPENAI_STRONG_MODEL: ${OPENAI_STRONG_MODEL:-gpt-4o}

  # Service URLs (using Docker internal DNS)
  MCP_SERVER_URL: http://mcp-server:8001
  JOB_API_URL: http://job-api:8000
  AGENT_RUNTIME_URL: http://agent-runtime:8002

  # Redis
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_TTL_SECONDS: 3600

  # Pub/Sub emulator
  PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
  PUBSUB_PROJECT_ID: local-project
  PUBSUB_TOPIC_ANALYSIS_REQUESTS: analysis-requests
  PUBSUB_TOPIC_ANALYSIS_DLQ: analysis-dlq
  PUBSUB_SUBSCRIPTION_AGENT_WORKER: agent-worker-sub
  PUBSUB_MAX_RETRIES: "3"

  # Firestore (use in-memory fallback for pure local dev)
  FIRESTORE_PROJECT_ID: local-project

  # Langfuse
  LANGFUSE_HOST: http://langfuse:3000
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local}
  LANGFUSE_ENABLED: "true"

  # LiteLLM proxy — set by default so Lab 3 routes every LLM call through it
  # (see packages/shared-config/config.py::get_llm). Labs 1-2 run without
  # Docker, so LITELLM_BASE_URL stays unset there and get_llm() falls back to
  # calling providers directly — no proxy container exists outside compose.
  LITELLM_BASE_URL: http://litellm-proxy:4000
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-litellm-master}

  # Security
  INTERNAL_API_TOKEN: dev-token-local
  API_AUTH_ENABLED: "false"

  # Guardrails
  GUARDRAIL_MAX_INPUT_LENGTH: "2000"
  GUARDRAIL_MAX_TOOL_CALLS: "30"
  GUARDRAIL_INJECTION_DETECTION: "true"

  # Rate limiting
  RATE_LIMIT_RPM: "20"

networks:
  stock-agent-net:
    driver: bridge

volumes:
  redis-data:
  postgres-data:

services:

  # ---------------------------------------------------------------------------
  # Infrastructure Services
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: stock-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - stock-agent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: stock-agent-pubsub
    command: >
      gcloud beta emulators pubsub start
      --host-port=0.0.0.0:8085
      --project=local-project
    ports:
      - "8085:8085"
    networks:
      - stock-agent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/v1/projects/local-project/topics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Pub/Sub topic + subscription initializer (runs once and exits)
  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: stock-agent-pubsub-init
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    networks:
      - stock-agent-net
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    # Use curl REST API — idempotent (ignore 409 if already exists)
    command:
      - sh
      - -c
      - >-
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/analysis-requests ;
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/topics/analysis-dlq ;
        curl -s -X PUT http://pubsub-emulator:8085/v1/projects/local-project/subscriptions/agent-worker-sub
        -H Content-Type:application/json
        -d '{"topic":"projects/local-project/topics/analysis-requests","ackDeadlineSeconds":60}' ;
        echo Pub/Sub ready
    restart: "no"

  # ---------------------------------------------------------------------------
  # Langfuse (LLM Observability)
  # Teaching note: Self-hosted, completely free!
  # ---------------------------------------------------------------------------

  # Shared Postgres instance — Langfuse's own DB (created via POSTGRES_USER/
  # POSTGRES_DB below) plus a second "litellm" database for litellm-proxy's
  # admin UI, added by docker/postgres-init/init-litellm-db.sql (only runs
  # on a fresh/empty volume, same as any docker-entrypoint-initdb.d script).
  # One instance, two logical databases — not two containers — to save the
  # resource footprint of a second full Postgres for a local teaching lab.
  postgres:
    image: postgres:16-alpine
    container_name: stock-agent-postgres
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_local
      POSTGRES_DB: langfuse
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - stock-agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 3s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: stock-agent-langfuse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_local@postgres:5432/langfuse
      NEXTAUTH_SECRET: local-secret-change-in-prod
      NEXTAUTH_URL: http://localhost:3000
      SALT: local-salt-change-in-prod
      ENCRYPTION_KEY: 2de75fdb3d5237e1b42185d07f29fcbf22cb4812487b227189f793eda6479d5e
      LANGFUSE_INIT_ORG_ID: local-org
      LANGFUSE_INIT_ORG_NAME: "Stock Agent Demo"
      LANGFUSE_INIT_PROJECT_ID: local-project
      LANGFUSE_INIT_PROJECT_NAME: "Stock Analysis"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local
      LANGFUSE_INIT_USER_EMAIL: admin@example.com
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: admin123
    networks:
      - stock-agent-net
    healthcheck:
      # Teaching note:
      #   Next.js 14 binds to the container's hostname (e.g. 57e6027595ec:3000),
      #   NOT localhost — so "wget http://localhost:3000" gets Connection Refused
      #   from inside the container even though the service is fully running.
      #   Fix: use $(hostname) which resolves to the container's Docker network IP.
      test: ["CMD-SHELL", "wget -qO- http://$(hostname):3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # LiteLLM Proxy (routes every LLM call, reports to Langfuse natively)
  # ---------------------------------------------------------------------------

  litellm-proxy:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    container_name: stock-agent-litellm
    restart: unless-stopped
    depends_on:
      langfuse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "4010:4000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-litellm-master}
      # Backs the /ui admin dashboard (spend graphs, request logs, virtual
      # key management) — without this litellm-proxy runs fine (routing,
      # budget/parallel-request limits, the Langfuse callback are all
      # in-memory, no DB needed for any of that) but /ui's login fails with
      # "Not connected to DB!", since there's nowhere to store/read an admin
      # user against. Shares the `postgres` service above with Langfuse (a
      # separate "litellm" database on it, seeded by
      # docker/postgres-init/init-litellm-db.sql) rather than its own
      # container — one Postgres instance for the whole local stack.
      DATABASE_URL: postgresql://litellm:litellm_local@postgres:5432/litellm
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local}
      # Vertex AI backend (config.yaml's vertex-* model_list entries): no
      # API key, Application Default Credentials instead — the same
      # `gcloud auth application-default login` session your host already
      # has, via the read-only mount below. If you've never run that
      # command, the mount is still harmless (an empty directory) — the
      # vertex-* models just won't authenticate; Google AI Studio/OpenAI
      # are unaffected.
      GCP_PROJECT: ${GCP_PROJECT:-local-project}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud-config/application_default_credentials.json
    volumes:
      - ${HOME}/.config/gcloud:/gcloud-config:ro
    networks:
      - stock-agent-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------

  mcp-server:
    build:
      context: ..
      dockerfile: apps/mcp-server/Dockerfile
    container_name: stock-agent-mcp
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      SERVICE_NAME: mcp-server
      PORT: "8001"
    volumes:
      - ~/.config/gcloud:/home/appuser/.config/gcloud:ro
    depends_on:
      litellm-proxy:
        condition: service_healthy
    networks:
      - stock-agent-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  job-api:
    build:
      context: ..
      dockerfile: apps/job-api/Dockerfile
    container_name: stock-agent-job-api
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      SERVICE_NAME: job-api
      PORT: "8000"
    volumes:
      - ~/.config/gcloud:/home/appuser/.config/gcloud:ro
    depends_on:
      redis:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy
    networks:
      - stock-agent-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  agent-runtime:
    build:
      context: ..
      dockerfile: apps/agent-runtime/Dockerfile
    container_name: stock-agent-worker
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
      SERVICE_NAME: agent-runtime
      WORKER_MODE: pubsub
    volumes:
      - ~/.config/gcloud:/home/appuser/.config/gcloud:ro
    depends_on:
      mcp-server:
        condition: service_healthy
      job-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    networks:
      - stock-agent-net
    restart: unless-stopped
    # Scale workers: docker compose up --scale agent-runtime=3
    deploy:
      replicas: 1

  frontend-streamlit:
    build:
      context: ..
      dockerfile: apps/frontend-streamlit/Dockerfile
    container_name: stock-agent-ui
    ports:
      - "8501:8501"
    environment:
      <<: *common-env
      SERVICE_NAME: frontend-streamlit
      JOB_API_URL: http://job-api:8000
      LANGFUSE_HOST: http://localhost:3000
    depends_on:
      job-api:
        condition: service_healthy
    networks:
      - stock-agent-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

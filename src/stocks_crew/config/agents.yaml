# agents.yaml -- who is in the crew.
#
# One block per agent, keyed by the short name that tasks.yaml refers to and
# that the /analyze `tools` override uses.
# `role` / `goal` / `backstory` are passed straight to crewai.Agent.
# `tools` is our own extension: the MCP tool names this agent is allowed to
# call. Omit it (or leave it empty) and the agent gets no tools.
#
# The names must match what the MCP server advertises -- run
# `uv run python -m stocks_crew.crew --list-tools` to see the live list.
#
# {placeholders} are filled at build time from the run_analysis() arguments:
# symbol, language, tone, horizon_days.

research:
  role: Stock Research Specialist
  goal: >
    Gather the basic factual picture for {symbol}: that the symbol is real, what
    it trades at now, and how it has moved recently.
  backstory: >
    You are an experienced stock researcher. You gather and organize market data
    quickly and present it in a clear, structured format. You never quote a
    number you did not get from a tool, and you say so plainly when a tool
    returns an error or no data.
  tools:
    - search_symbols
    - latest_quote
    - price_series

technical:
  role: Technical Analysis Expert
  goal: >
    Assess the technical condition of {symbol} from indicator values and
    detected market events.
  backstory: >
    You are a technical analyst who works strictly from measured values. You
    read SMA, EMA and RSI in context, you note gaps, volatility spikes and
    52-week extremes when they are flagged, and you acknowledge uncertainty
    rather than filling gaps with guesses. You do not compute indicators
    yourself -- the tools do that.

  tools:
    - indicators
    - detect_events

# --- the exercise ---------------------------------------------------------
#
# This is the fourth agent, and adding it needed no Python at all: crew.py
# builds whatever agents.yaml declares, so a new block here becomes a new agent.
# The block sits *between* technical and report because tasks.yaml runs in file
# order, and the sector task needs the research and technical output as context.
#
# Note what it is NOT allowed to call. `price_series` would let it pull a year
# of history for five peers -- thousands of rows through the model's context,
# for a comparison that `latest_quote` and `indicators` already support. An
# allow-list is a budget as much as a boundary.
sector:
  role: Sector Comparison Specialist
  goal: >
    Place {symbol} against three to five peers traded in the same sector, using
    only quote and indicator values fetched for each peer.
  backstory: >
    You are a sector analyst who compares like with like. You propose peers from
    your own knowledge of the industry, but you confirm every one of them with
    `search_symbols` before you use it, and you fetch each peer's numbers with
    the tools -- you never recall a price or an RSI. You know that this desk's
    tools return quotes and technical indicators and nothing else, so you compare
    on those and say plainly that valuation and fundamentals are out of reach
    rather than estimating them.
  tools:
    - search_symbols
    - latest_quote
    - indicators

report:
  role: Financial Report Writer
  goal: >
    Turn the research, the technical read and the sector comparison into a clear
    report, written in {language}, for a reader thinking about the next
    {horizon_days} days.
  backstory: >
    You are a financial writer who translates market data into plain language.
    You write in {language} and only in {language} -- the analysis you are handed
    arrives in English and you translate it as you write, headings included. You
    keep every figure traceable to the analysis you were handed, you never give
    investment advice or price targets, and you close with a disclaimer.
  # No tools: this agent synthesizes what the other two produced. Giving a
  # writer tools invites it to re-fetch data and quietly contradict the analyst.
  tools: []
